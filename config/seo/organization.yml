# Fakta tetap entitas Prisma Advertising untuk schema Organization.
#
# Sumber: request/SEO_Strategist/prisma-schema-spec.md bagian 1, diverifikasi
# strategist terhadap halaman Contact dan About pada 2026-10-08.
#
# Yang disimpan di sini HANYA nilai yang praktis tidak pernah berubah dan tidak
# perlu form admin. Nilai operasional (email, telepon, WhatsApp, sameAs, deskripsi,
# logo, founding date) ada di admin Company Profile, dan daftar penghargaan dibaca
# dari CRUD Awards — jadi tim SEO tetap bisa mengubahnya tanpa developer.

# Nama dagang. Berbeda dari badan hukum di bawah.
name: "Prisma Advertising"
legal_name: "PT Prisma Harapan"

alternate_names:
  - "Prisma Ads"
  - "Prisma OOH"

# Tahun saja, sesuai spec. Jangan ditulis sebagai tanggal penuh.
founding_year: "2004"

area_served:
  - type: "City"
    name: "Jakarta"
  - type: "City"
    name: "Bandung"
  - type: "AdministrativeArea"
    name: "Bali"

knows_about:
  - "Billboard advertising"
  - "Videotron"
  - "Digital out-of-home (DOOH)"
  - "Transit advertising"
  - "Creative OOH"
  - "3D anamorphic content"

# @id harus sama persis dengan yang dikeluarkan situs masing-masing (filter RankMath
# di WordPress mereka), supaya relasi induk-anak tersambung dari kedua sisi.
sub_organizations:
  - id: "https://pixcreativemindworks.com/#organization"
    name: "PiX Creative Mindworks"
    url: "https://pixcreativemindworks.com/"
  - id: "https://boostad.co.id/#organization"
    name: "BoostAD"
    url: "https://boostad.co.id/"

# Dua titik kontak sesuai spec. Nomor ditulis format internasional dengan tanda hubung.
contact_points:
  - contact_type: "sales"
    telephone: "+62-811-1306-888"
    email: "sales@prisma-ads.com"
    area_served: "ID"
    available_language: ["id", "en"]
  - contact_type: "customer service"
    telephone: "+62-21-5835-6575"
    email: "info@prisma-ads.com"
    area_served: "ID"
    available_language: ["id", "en"]
