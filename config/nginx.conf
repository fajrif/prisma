# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/
#   *** YOU NEED TO DISABLE SElinux ***
#
# CATATAN: file ini SALINAN REFERENSI dari /etc/nginx/nginx.conf di production.
# Tidak ikut ter-deploy oleh git pull — perubahan di sini harus disalin manual ke
# server, lalu `sudo nginx -t && sudo systemctl reload nginx`.

user deployer;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # T15: kompres respons dinamis (HTML dari Rails ±100-170 KB -> ±20-30 KB, JSON, SVG). Sebelumnya hanya
    # /assets yang terkompresi (gzip_static, file .gz hasil precompile); HTML dikirim mentah sehingga di
    # koneksi jauh/lambat unduhan dokumen menahan CSS & gambar (PSI: dokumen 113 KB selesai di 5,5 dtk).
    # text/html selalu ikut bila gzip on. Token CSRF Rails di-mask per request, jadi aman dari BREACH.
    # Cek setelah reload: curl -s -o /dev/null -H 'Accept-Encoding: gzip' -w '%{size_download}\n' https://prisma-ads.com/
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/rss+xml application/ld+json image/svg+xml application/manifest+json;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    # T15: cache gambar Active Storage (/rails/active_storage/.../proxy/...). URL-nya stabil dan
    # tanpa cookie, jadi aman di-cache; gambar yang sama tidak lagi menyentuh Unicorn.
    # Folder dibuat sekali: sudo mkdir -p /var/cache/nginx/prisma_images && sudo chown deployer /var/cache/nginx/prisma_images
    proxy_cache_path /var/cache/nginx/prisma_images levels=1:2 keys_zone=prisma_images:20m
                     max_size=2g inactive=30d use_temp_path=off;

    upstream unicorn_prisma {
      server unix:/home/deployer/prisma/tmp/sockets/unicorn.prisma.sock fail_timeout=0;
    }

    server {
        server_name  prisma-ads.com;
        root         /home/deployer/prisma/public;

        try_files $uri/index.html $uri @unicorn_prisma;
        location @unicorn_prisma {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Host $http_host;
                proxy_buffering off;
                proxy_redirect off;
                proxy_pass http://unicorn_prisma;
        }
        # T15: gambar Active Storage di-cache nginx (hanya GET/HEAD; unggahan admin tidak terpengaruh).
        # Uji: curl -sI <url gambar> | grep -i x-cache  -> MISS lalu HIT. Hapus cache: rm -rf /var/cache/nginx/prisma_images/*
        location ~ ^/rails/active_storage/(representations|blobs)/proxy/ {
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://unicorn_prisma;

                proxy_cache prisma_images;
                proxy_cache_key $scheme$host$request_uri;
                proxy_cache_valid 200 206 30d;
                proxy_cache_lock on;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
                proxy_ignore_headers Set-Cookie;
                add_header X-Cache $upstream_cache_status always;
                expires max;
            }

        location / {
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme; # important!
                proxy_pass http://unicorn_prisma;
            }

            location @unicorn_prisma {
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://unicorn_prisma;
            }

            location ~ ^/(assets|packs|uploads)/ {
                root /home/deployer/prisma/public;
                gzip_static on;
                expires max;
                add_header Cache-Control public;
            }

        client_body_temp_path /home/deployer/prisma/tmp 1 2;
        client_max_body_size 4G;
        proxy_max_temp_file_size 3072m;
        keepalive_timeout 80;
        client_header_timeout 3m;
        client_body_timeout 3m;
        send_timeout 3m;

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

        listen 443 ssl;
        # T15: HTTP/2 (satu koneksi, unduhan paralel CSS/JS/font/gambar). Butuh nginx >= 1.25.1
        # untuk direktif `http2 on;` (server: 1.26.3). Cek setelah reload: curl -sI --http2 https://prisma-ads.com/ | head -1
        http2 on;
        ssl_certificate /home/deployer/.ssl/prisma-ads.com.crt;
        ssl_certificate_key /home/deployer/.ssl/prisma-ads.com.key;
        # TLS 1.3 (jabat tangan 1 round-trip); TLS 1.0/1.1 usang dan sudah tidak didukung browser.
        # TLS 1.3 butuh OpenSSL >= 1.1.1: cek `nginx -V 2>&1 | grep -o 'OpenSSL [0-9.]*'`.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        # Session resumption: kunjungan berikutnya tidak mengulang jabat tangan TLS penuh.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # listen [::]:443 ssl; # managed by Certbot
        # listen 443 ssl; # managed by Certbot
        # ssl_certificate /etc/letsencrypt/live/prisma-ads.com/fullchain.pem; # managed by Certbot
        # ssl_certificate_key /etc/letsencrypt/live/prisma-ads.com/privkey.pem; # managed by Certbot
        # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

        # HTTP: apex maupun www sama-sama dipaksa ke HTTPS apex.
        # Tujuan ditulis eksplisit, bukan $host, supaya www tidak ikut terbawa.
        server {
                listen 80;
                server_name prisma-ads.com www.prisma-ads.com;

           ## Redirect to HTTPs
              location / {
                return 301 https://prisma-ads.com$request_uri;  # enforce https + apex
              }
        }

        # HTTPS www -> apex (301). Sertifikat prisma-ads.com.crt sudah mencakup
        # www sebagai SAN, jadi TLS handshake selesai lebih dulu dan redirect ini
        # sampai ke browser tanpa peringatan sertifikat.
        server {
                listen 443 ssl;
                http2 on;
                server_name www.prisma-ads.com;

                ssl_certificate /home/deployer/.ssl/prisma-ads.com.crt;
                ssl_certificate_key /home/deployer/.ssl/prisma-ads.com.key;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 1d;
                ssl_prefer_server_ciphers on;
                ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

                return 301 https://prisma-ads.com$request_uri;
        }

}
